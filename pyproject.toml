[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunch-search"
version = "0.1.0"
description = "Find your files by what they mean, not what they are called."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HerdingAI" }]
keywords = ["search", "semantic", "files", "desktop", "gnome", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
]

# Core tier only. Media models are optional extras so a first install stays small.
dependencies = [
  "sqlite-vec>=0.1.9",
  "numpy>=1.26",
  "platformdirs>=4.0",
  "keyring>=25.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=5.0",
  # Pinned, not just floored: transformers 5.x's PretrainedConfig refactor
  # breaks Florence-2's trust_remote_code config (AttributeError on
  # forced_bos_token_id), while anything below 4.51 predates Qwen3 model
  # support entirely. Verified empirically on this machine -- 4.49.0 and
  # 4.57.6 each break one of the two required models; 4.51.3 is the
  # narrow band that runs both.
  "transformers==4.51.3",
  "torch>=2.2",
  "pillow>=10.0",
  "einops>=0.8",
  "timm>=1.0",
]
media = ["faster-whisper>=1.2"]
# No `gui` extra on purpose. PyGObject from PyPI builds pycairo and
# girepository from source, needing a C toolchain plus libcairo2-dev and
# libgirepository-2.0-dev, and the result must still match the system's
# GTK/GIR libraries at runtime. Every Linux desktop already ships working
# bindings as distro packages (python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1),
# which is exactly what gui/app.py's ImportError message tells the user to
# install. Install hunch with `pipx install --system-site-packages` so the
# window can see them.
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
hunch = "hunch.cli:main"

[project.urls]
Homepage = "https://github.com/HerdingAI/hunch"
Issues = "https://github.com/HerdingAI/hunch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
