name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Install package
        run: pip install -e ".[dev]"
      # CPU-only: the GPU paths are exercised manually on the reference machine.
      - name: Run tests
        run: python -m pytest tests -v --ignore=tests/test_imagemeta.py
